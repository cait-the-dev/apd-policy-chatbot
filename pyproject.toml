[project]
name = "apd-policy-chatbot"
version = "0.1.0"
description = "Command-line PDF chatbot that answers questions about the Austin Police Department Policy Manual using a RAG pipeline (OpenAI embeddings + Chroma) and returns page-level citations."
authors = [
    {name = "Caitlin Arnspiger",email = "caitthedev@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai (>=1.79.0,<2.0.0)",
    "pdfplumber (>=0.11.6,<0.12.0)",
    "chromadb (>=1.0.9,<2.0.0)",
    "typer[all] (>=0.15.4,<0.16.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "apd_policy_chatbot" }]

[tool.poetry.scripts]
apd-chat = "apd_policy_chatbot.cli:app"

[tool.poetry.group.dev.dependencies]
sentence-transformers = ">=2.6.1"
torch = "^2.7.0"
torchvision = "^0.22.0"
pytest = "^8.3.5"
mypy = "^1.15.0"
ruff = "^0.11.10"

